<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px; color: var(--figma-color-text, #1e1e1e); background: var(--figma-color-bg, #fff); }
  .pad { padding: 12px 14px 16px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .title { font-weight:700; font-size:13px; }
  .badge { font-size:10px; padding:2px 7px; border-radius:999px;
    background: var(--figma-color-bg-secondary,#f0f0f0); color: var(--figma-color-text-secondary,#666); }
  .repobar { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px;
    background: var(--figma-color-bg-secondary,#f5f6f8); margin-bottom:10px; }
  .repobar .rlabel { flex:1; font-size:11px; color: var(--figma-color-text-secondary,#777);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link { background:none; border:0; color: var(--figma-color-text-brand,#0d99ff); cursor:pointer; font-size:11px; padding:0; }
  .card { border:1px solid var(--figma-color-border,#eaeaea); border-radius:10px; padding:11px; margin-bottom:12px; }
  .selbar { font-size:11px; color: var(--figma-color-text-secondary,#777); margin-bottom:9px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .selbar b { color: var(--figma-color-text,#1e1e1e); }
  label.fl { display:block; font-size:11px; font-weight:600; margin:8px 0 4px; }
  label.fl:first-child { margin-top:0; }
  input, textarea { width:100%; padding:8px; border-radius:7px; border:1px solid var(--figma-color-border,#d0d0d0);
    background: var(--figma-color-bg,#fff); color: var(--figma-color-text,#1e1e1e); font-family: inherit; font-size:12px; }
  textarea { min-height:54px; resize:vertical; }
  #desc { min-height:108px; }
  .iconbtn { background:none; border:0; font-size:16px; line-height:1; cursor:pointer; color: var(--figma-color-text-secondary,#888); padding:2px 4px; }
  .iconbtn:hover { color: var(--figma-color-text,#1e1e1e); }
  .reuse { display:flex; align-items:center; gap:6px; font-size:11px; color: var(--figma-color-text-secondary,#777); margin-top:7px; }
  .reuse input { width:auto; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  button.primary { background: var(--figma-color-bg-brand,#0d99ff); color:#fff; border:0; padding:8px 12px;
    border-radius:7px; cursor:pointer; font-weight:600; }
  button.primary:disabled { opacity:.4; cursor:default; }
  button.ghost { background: var(--figma-color-bg-secondary,#f0f1f3); border:1px solid var(--figma-color-border,#c4c7cc);
    color: var(--figma-color-text,#1e1e1e); padding:8px 12px; border-radius:7px; cursor:pointer; font-weight:500; }
  button.wide { width:100%; padding:11px; margin-top:4px; }
  .err { color:#d33; font-size:11px; margin-top:6px; min-height:14px; }
  .micro2 { font-size:10px; color: var(--figma-color-text-secondary,#999); margin-top:6px; }
  select { width:100%; padding:8px; border-radius:7px; border:1px solid var(--figma-color-border,#d0d0d0); background: var(--figma-color-bg,#fff); color: var(--figma-color-text,#1e1e1e); font-family:inherit; font-size:12px; }
  .sep { border-top:1px solid var(--figma-color-border,#eee); margin:12px 0; }
  .howto { font-size:11px; color: var(--figma-color-text-secondary,#777); background: var(--figma-color-bg-secondary,#f6f7f9); border:1px solid var(--figma-color-border,#eaeaea); border-radius:9px; padding:10px 12px; line-height:1.5; }
  .howto ol { margin:6px 0 0; padding-left:18px; }
  .tokstate { font-size:10px; font-weight:400; color:#1ea97c; }
  .list-h { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color: var(--figma-color-text-secondary,#888);
    margin:4px 0 8px; }
  .item { border:1px solid var(--figma-color-border,#eaeaea); border-radius:9px; padding:9px 10px; margin-bottom:7px;
    background: var(--figma-color-bg-secondary,#fafafa); }
  .cel { font-size:11px; font-weight:700; color: var(--figma-color-text-brand,#0d99ff); margin-bottom:3px; }
  .det { font-weight:400; color: var(--figma-color-text-secondary,#999); font-size:10px; }
  .cd { font-size:12px; line-height:1.45; white-space:pre-wrap; }
  .crow { display:flex; align-items:center; gap:10px; margin-top:5px; }
  .cj { flex:1; font-size:10px; color: var(--figma-color-text-secondary,#777); cursor:pointer; text-decoration:underline;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .del { font-size:10px; color: var(--figma-color-text-secondary,#999); cursor:pointer; text-decoration:underline; }
  .empty { color: var(--figma-color-text-secondary,#999); font-size:11px; padding:12px 0; text-align:center; }
  .sync { font-size:11px; margin-top:8px; min-height:14px; color: var(--figma-color-text-secondary,#888); word-break:break-all; }
  .sync.ok { color:#1ea97c; } .sync.warn { color:#b8860b; }
  .sync a { color: var(--figma-color-text-brand,#0d99ff); }
  .hide { display:none; }
  .ro { font-size:11px; color:#b8860b; margin-bottom:10px; }
  .selwarn { font-size:11px; color:#b8860b; background: rgba(184,134,11,.08); border:1px solid rgba(184,134,11,.35);
    border-radius:7px; padding:8px 9px; margin-bottom:9px; line-height:1.4; }
</style>
</head>
<body>
  <div class="pad">
    <div class="head"><span class="title">Snapship</span><button class="iconbtn" id="settingsBtn" title="Settings — repository & token">⚙</button></div>

    <!-- settings (full panel) -->
    <div id="setup" class="card hide">
      <label class="fl" for="repoSelect">Active repository</label>
      <select id="repoSelect"></select>
      <label class="fl" for="repoFolder">Default folder for this repo (optional)</label>
      <input id="repoFolder" type="text" placeholder="e.g. Docs/Designs" />
      <div class="micro2">Commits go to &lt;default folder&gt;/&lt;commit folder&gt;.</div>
      <div class="row"><button class="ghost" id="removeRepo">Remove this repo</button></div>

      <div class="sep"></div>

      <label class="fl" for="repoUrl">Add a repository — URL</label>
      <input id="repoUrl" type="text" placeholder="https://github.com/owner/repo or https://gitlab.com/group/repo" />
      <label class="fl" for="repoToken">Access token</label>
      <input id="repoToken" type="password" placeholder="GitHub classic PAT (repo) · GitLab PAT (api)" />
      <label class="fl" for="repoAddFolder">Default folder (optional)</label>
      <input id="repoAddFolder" type="text" placeholder="e.g. Docs/Designs" />
      <div class="micro2">Token is stored locally (Figma clientStorage) — never in the file, never synced.</div>
      <div class="row"><button class="primary" id="addRepoBtn">Add repository</button></div>

      <div class="sep"></div>

      <label class="reuse"><input type="checkbox" id="reuseId" checked /> Reuse folder for the next change</label>

      <div class="row" style="margin-top:12px;"><button class="ghost" id="cancelSetup">Close</button></div>
    </div>

    <div id="main">
      <div class="ro hide" id="roNote">Dev Mode — read only. Switch to Design mode to log changes.</div>

      <div class="repobar">
        <span class="rlabel" id="repoLabel">No repository set</span>
      </div>

      <!-- add a change -->
      <div class="card">
      <div class="selbar" id="selbar">For: <b>(no selection)</b></div>
      <div class="selwarn hide" id="selwarn"></div>
      <label class="fl" for="desc">Description</label>
      <textarea id="desc" placeholder="What changed…"></textarea>
      <label class="fl" for="folder">Commit folder (optional)</label>
      <input id="folder" type="text" placeholder="e.g. NX-3829" />
      <div class="micro2">Added under the repo's default folder.</div>
      <div class="row"><button class="primary" id="addChange">Add change</button></div>
      <div class="err" id="err"></div>
    </div>

    <div class="list-h">Changes</div>
    <div id="list"></div>

    <label class="fl" for="prTitle">PR / MR title</label>
    <input id="prTitle" type="text" placeholder="Design changes —…" />
    <button class="primary wide" id="commit">Commit Changes</button>
    <div class="sync" id="status"></div>
    </div>
  </div>

  <script>
    var editable = true;
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function send(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }
    function shortRepo(u) { return (u || "").replace(/^https?:\/\//, "").replace(/\/$/, ""); }
    function jiraShort(u) { var m = (u || "").match(/([A-Z][A-Z0-9]+-\d+)/); return m ? m[1] : u; }

    function openSettings() { document.getElementById("setup").classList.remove("hide"); document.getElementById("main").classList.add("hide"); }
    function closeSettings() { document.getElementById("setup").classList.add("hide"); document.getElementById("main").classList.remove("hide"); }
    document.getElementById("settingsBtn").onclick = function () {
      if (document.getElementById("setup").classList.contains("hide")) openSettings(); else closeSettings();
    };
    document.getElementById("cancelSetup").onclick = closeSettings;
    document.getElementById("addRepoBtn").onclick = function () {
      var url = document.getElementById("repoUrl").value.trim();
      if (!url) return;
      send({ type: "addRepo", url: url, token: document.getElementById("repoToken").value.trim(), folder: document.getElementById("repoAddFolder").value.trim() });
      document.getElementById("repoUrl").value = "";
      document.getElementById("repoToken").value = "";
      document.getElementById("repoAddFolder").value = "";
    };
    document.getElementById("removeRepo").onclick = function () {
      var url = document.getElementById("repoSelect").value;
      if (url) send({ type: "removeRepo", url: url });
    };
    document.getElementById("repoSelect").onchange = function () { send({ type: "selectRepo", url: this.value }); };
    document.getElementById("repoFolder").onchange = function () {
      var url = document.getElementById("repoSelect").value;
      if (url) send({ type: "addRepo", url: url, folder: this.value.trim() });
    };
    document.getElementById("reuseId").onchange = function () { send({ type: "setReuse", on: this.checked }); };

    document.getElementById("addChange").onclick = function () {
      var folder = document.getElementById("folder").value.trim();
      var desc = document.getElementById("desc").value.trim();
      if (!desc) { document.getElementById("err").textContent = "Add a description."; return; }
      send({ type: "addChange", folder: folder, desc: desc });
      document.getElementById("desc").value = "";
      if (!document.getElementById("reuseId").checked) document.getElementById("folder").value = "";
      document.getElementById("err").textContent = "";
    };

    document.getElementById("commit").onclick = function () {
      var st = document.getElementById("status");
      st.className = "sync"; st.textContent = "Committing…";
      send({ type: "commit", repo: document.getElementById("repoSelect").value, folder: document.getElementById("folder").value.trim() });
    };

    function renderChanges(changes) {
      var box = document.getElementById("list");
      box.innerHTML = "";
      document.getElementById("commit").disabled = !changes.length || !editable;
      if (!changes.length) { box.innerHTML = '<div class="howto"><b>How it works</b><ol><li>Select a frame or element in Figma.</li><li>Write what changed in the description.</li><li>Click <b>Add change</b> (repeat per element).</li><li>Click <b>Commit Changes</b> — opens a PR/MR with screenshots + a manifest an AI can build from.</li></ol></div>'; return; }
      changes.forEach(function (c) {
        var row = document.createElement("div");
        row.className = "item";
        var head = c.element ? '<div class="cel">▸ ' + esc(c.element) + '</div>' : "";
        var d = c.desc ? '<div class="cd">' + esc(c.desc) + '</div>' : "";
        row.innerHTML = head + d + '<div class="crow"><span class="cj"></span><a class="del" data-id="' + c.id + '">delete</a></div>';
        box.appendChild(row);
      });
      box.querySelectorAll(".del").forEach(function (el) {
        el.onclick = function () { send({ type: "deleteChange", id: el.getAttribute("data-id") }); };
      });
      box.querySelectorAll(".cj[data-url]").forEach(function (el) {
        el.onclick = function () { send({ type: "openUrl", url: el.getAttribute("data-url") }); };
      });
    }

    // ----- GitHub / GitLab commit -----
    function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
    async function ghErr(r, label) { var m = ""; try { m = (await r.json()).message || ""; } catch (e) {} throw new Error(label + " (" + r.status + (m ? ": " + m : "") + ")"); }

    function u8toB64(arr) { var s = ""; for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]); return btoa(s); }

    async function commitRepo(repoUrl, token, files, title, body) {
      var u = repoUrl.replace(/\/+$/, "").replace(/\/(tree|blob)\/[^\/]+\/?$/, "");
      if (u.indexOf("github.com") > -1) return githubCommit(u, token, files, title, body);
      if (u.indexOf("gitlab.com") > -1) return gitlabCommit(u, token, files, title, body);
      throw new Error("URL must be a github.com or gitlab.com repository.");
    }

    async function githubCommit(url, token, files, title, body) {
      var mm = url.match(/github\.com\/([^\/]+)\/([^\/]+?)(?:\.git)?\/?$/);
      if (!mm) throw new Error("Couldn't parse owner/repo from the URL.");
      var api = "https://api.github.com/repos/" + mm[1] + "/" + mm[2];
      var H = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" };
      var branch = "snapship-changes-" + Date.now();
      var r = await fetch(api, { headers: H }); if (!r.ok) await ghErr(r, "Repo read");
      var base = (await r.json()).default_branch;
      r = await fetch(api + "/git/ref/heads/" + base, { headers: H }); if (!r.ok) await ghErr(r, "Read base branch");
      var sha = (await r.json()).object.sha;
      r = await fetch(api + "/git/refs", { method: "POST", headers: H, body: JSON.stringify({ ref: "refs/heads/" + branch, sha: sha }) });
      if (!r.ok) await ghErr(r, "Create branch");
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var payload = { message: title, content: f.b64, branch: branch };
        var cr = await fetch(api + "/contents/" + encodeURI(f.path) + "?ref=" + branch, { headers: H });
        if (cr.ok) payload.sha = (await cr.json()).sha;
        r = await fetch(api + "/contents/" + encodeURI(f.path), { method: "PUT", headers: H, body: JSON.stringify(payload) });
        if (r.status === 422) {
          var cr2 = await fetch(api + "/contents/" + encodeURI(f.path) + "?ref=" + branch, { headers: H });
          if (cr2.ok) payload.sha = (await cr2.json()).sha;
          r = await fetch(api + "/contents/" + encodeURI(f.path), { method: "PUT", headers: H, body: JSON.stringify(payload) });
        }
        if (!r.ok) await ghErr(r, "Commit " + f.path);
      }
      r = await fetch(api + "/pulls", { method: "POST", headers: H, body: JSON.stringify({ title: title, head: branch, base: base, body: body || "Generated by Snapship." }) });
      if (!r.ok) await ghErr(r, "Open PR");
      return (await r.json()).html_url;
    }

    async function gitlabCommit(url, token, files, title, body) {
      var mm = url.match(/gitlab\.com\/(.+?)(?:\.git)?\/?$/);
      if (!mm) throw new Error("Couldn't parse project path from the URL.");
      var api = "https://gitlab.com/api/v4/projects/" + encodeURIComponent(mm[1]);
      var H = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
      var branch = "snapship-changes-" + Date.now();
      var r = await fetch(api, { headers: H }); if (!r.ok) throw new Error("Project read (" + r.status + ")");
      var target = (await r.json()).default_branch;
      var actions = [];
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var ex = await fetch(api + "/repository/files/" + encodeURIComponent(f.path) + "?ref=" + target, { headers: H });
        actions.push({ action: ex.ok ? "update" : "create", file_path: f.path, content: f.b64, encoding: "base64" });
      }
      r = await fetch(api + "/repository/commits", { method: "POST", headers: H, body: JSON.stringify({ branch: branch, start_branch: target, commit_message: title, actions: actions }) });
      if (!r.ok) throw new Error("Commit files (" + r.status + ")");
      r = await fetch(api + "/merge_requests", { method: "POST", headers: H, body: JSON.stringify({ source_branch: branch, target_branch: target, title: title, description: body || "Generated by Snapship." }) });
      if (!r.ok) throw new Error("Open MR (" + r.status + ")");
      return (await r.json()).web_url;
    }

    async function runCommit(m) {
      var st = document.getElementById("status");
      try {
        var base = m.base || "handoff";
        var files = [{ path: base + "/changes.md", b64: b64(m.markdown) }];
        if (m.json) files.push({ path: base + "/changes.json", b64: b64(m.json) });
        if (m.structure) files.push({ path: base + "/structure.md", b64: b64(m.structure) });
        (m.images || []).forEach(function (img) { files.push({ path: base + "/img/" + img.name, b64: u8toB64(img.bytes) }); });
        var title = (document.getElementById("prTitle").value.trim()) || ("Design changes —" + (m.fileName || "Figma"));
        var url = await commitRepo(m.repoUrl, m.token, files, title, m.prBody || "Generated by Snapship.");
        st.className = "sync ok";
        st.innerHTML = "✓ Committed: <a id='cl' href='#'>" + esc(url) + "</a>";
        document.getElementById("cl").onclick = function (e) { e.preventDefault(); send({ type: "openUrl", url: url }); };
        send({ type: "committed" });
        document.getElementById("desc").value = "";
        if (!document.getElementById("reuseId").checked) document.getElementById("folder").value = "";
      } catch (e) {
        st.className = "sync warn";
        st.textContent = "Failed: " + (e && e.message ? e.message : e);
      }
    }

    onmessage = function (e) {
      var msg = e.data.pluginMessage;
      if (!msg) return;
      if (msg.type === "state") {
        editable = msg.editable;
        document.getElementById("roNote").classList.toggle("hide", editable);
        document.getElementById("addChange").disabled = !editable || (msg.selectionCount || 0) === 0;

        var repos = msg.repos || [];
        var rs = document.getElementById("repoSelect");
        rs.innerHTML = "";
        if (!repos.length) { var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "No repositories — add one below"; rs.appendChild(o0); }
        repos.forEach(function (r) { var o = document.createElement("option"); o.value = r.url; o.textContent = r.url.replace(/^https?:\/\//, ""); if (r.url === msg.selected) o.selected = true; rs.appendChild(o); });
        var selRepo = repos.filter(function (r) { return r.url === msg.selected; })[0];
        document.getElementById("repoFolder").value = selRepo ? (selRepo.folder || "") : "";
        document.getElementById("repoLabel").textContent = msg.selected ? shortRepo(msg.selected) : "No repository — open Settings ⚙";
        if (!repos.length) openSettings();

        document.getElementById("reuseId").checked = msg.reuseId !== false;
        var folderEl = document.getElementById("folder");
        if (msg.reuseId !== false && !folderEl.value && msg.folder) folderEl.value = msg.folder;

        document.getElementById("selbar").innerHTML = "For: <b>" + (msg.selection ? esc(msg.selection) : "(no selection)") + "</b>";

        var sw = document.getElementById("selwarn");
        if ((msg.selectionCount || 0) > 10) {
          sw.classList.remove("hide");
          sw.textContent = "⚠ " + msg.selectionCount + " elements selected — that's likely the contents of a frame, not the frame itself. Select the parent frame instead (click the frame once, or pick it in the Layers panel) so the change captures the whole design.";
        } else {
          sw.classList.add("hide");
          sw.textContent = "";
        }

        var prt = document.getElementById("prTitle");
        if (!prt.value) prt.value = "Design changes —" + (msg.fileName || "Figma");

        renderChanges(msg.changes || []);
      }
      if (msg.type === "err") { document.getElementById("err").textContent = msg.message; }
      if (msg.type === "commitDone" && !msg.ok) {
        var st = document.getElementById("status");
        st.className = "sync warn"; st.textContent = "Failed: " + (msg.message || "unknown error");
      }
      if (msg.type === "doCommit") { runCommit(msg); }
    };
  </script>
</body>
</html>
