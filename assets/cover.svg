<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#39d0a8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2b"/>
      <stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <style>
      .h { font-family: 'DejaVu Sans', Arial, sans-serif; font-weight: 700; fill: #eef1f6; }
      .sub { font-family: 'DejaVu Sans', Arial, sans-serif; font-weight: 400; fill: #aab2c0; }
      .chip { font-family: 'DejaVu Sans', Arial, sans-serif; font-weight: 600; fill: #cdd5e2; }
      .logo { font-family: 'DejaVu Sans', Arial, sans-serif; font-weight: 700; fill: #eef1f6; }
      .mut { font-family: 'DejaVu Sans', Arial, sans-serif; font-weight: 400; fill: #8b94a4; }
      .code { font-family: 'DejaVu Sans Mono', monospace; font-weight: 400; fill: #aab2c0; }
    </style>
  </defs>

  <rect width="1920" height="960" fill="url(#bg)"/>
  <circle cx="1500" cy="200" r="420" fill="#5b8cff" opacity="0.06"/>
  <circle cx="1650" cy="780" r="360" fill="#39d0a8" opacity="0.06"/>

  <!-- LEFT: text -->
  <g transform="translate(140,150)">
    <circle cx="16" cy="10" r="15" fill="url(#g)"/>
    <circle cx="16" cy="10" r="5" fill="#0b0d12"/>
    <text class="logo" x="44" y="20" font-size="30">Relay</text>

    <text class="h" x="0" y="200" font-size="104">Designer intent,</text>
    <text class="h" x="0" y="320" font-size="104">inside Dev Mode.</text>

    <text class="sub" x="2" y="400" font-size="34">Interactions, states &amp; accessibility — captured in</text>
    <text class="sub" x="2" y="446" font-size="34">Figma, read by developers where they build.</text>

    <!-- chips -->
    <g transform="translate(0,510)">
      <rect x="0" y="0" width="220" height="58" rx="29" fill="none" stroke="#2a3140" stroke-width="2"/>
      <text class="chip" x="32" y="38" font-size="26">Interaction</text>
      <rect x="244" y="0" width="160" height="58" rx="29" fill="none" stroke="#2a3140" stroke-width="2"/>
      <text class="chip" x="276" y="38" font-size="26">States</text>
      <rect x="428" y="0" width="248" height="58" rx="29" fill="none" stroke="#2a3140" stroke-width="2"/>
      <text class="chip" x="460" y="38" font-size="26">Accessibility</text>
    </g>
  </g>

  <!-- RIGHT: illustration -->
  <g transform="translate(1140,210)">
    <!-- design frame -->
    <rect x="0" y="40" width="300" height="470" rx="20" fill="url(#panel)" stroke="#2a3140" stroke-width="2"/>
    <text class="mut" x="26" y="86" font-size="22">Design</text>
    <rect x="26" y="118" width="248" height="150" rx="12" fill="#222a39"/>
    <rect x="26" y="292" width="180" height="20" rx="10" fill="#2f3a4d"/>
    <rect x="26" y="328" width="220" height="20" rx="10" fill="#2f3a4d"/>
    <rect x="26" y="364" width="140" height="20" rx="10" fill="#2f3a4d"/>
    <!-- intent pins on the frame -->
    <circle cx="266" cy="150" r="18" fill="url(#g)" stroke="#0b0d12" stroke-width="4"/>
    <text x="266" y="157" font-size="20" font-family="'DejaVu Sans',sans-serif" font-weight="700" fill="#0b0d12" text-anchor="middle">1</text>
    <circle cx="266" cy="338" r="18" fill="url(#g)" stroke="#0b0d12" stroke-width="4"/>
    <text x="266" y="345" font-size="20" font-family="'DejaVu Sans',sans-serif" font-weight="700" fill="#0b0d12" text-anchor="middle">2</text>

    <!-- relay arrow -->
    <path d="M 320 280 H 392" stroke="url(#g)" stroke-width="5" fill="none"/>
    <path d="M 386 270 L 402 280 L 386 290 Z" fill="#39d0a8"/>

    <!-- dev mode panel -->
    <rect x="420" y="40" width="320" height="470" rx="20" fill="url(#panel)" stroke="#2a3140" stroke-width="2"/>
    <g transform="translate(446,84)">
      <text class="mut" x="0" y="0" font-size="22">Dev Mode</text>
      <rect x="170" y="-18" width="100" height="30" rx="15" fill="#15324a"/>
      <text class="code" x="186" y="3" font-size="17" fill="#5b8cff">inspect</text>
    </g>
    <!-- note 1 -->
    <rect x="446" y="120" width="268" height="92" rx="10" fill="#1f2735"/>
    <text class="code" x="464" y="150" font-size="18" fill="#39d0a8">INTERACTION</text>
    <text class="sub" x="464" y="180" font-size="19">On tap → expand row,</text>
    <text class="sub" x="464" y="204" font-size="19">animate height 200ms.</text>
    <!-- note 2 -->
    <rect x="446" y="230" width="268" height="92" rx="10" fill="#1f2735"/>
    <text class="code" x="464" y="260" font-size="18" fill="#39d0a8">ACCESSIBILITY</text>
    <text class="sub" x="464" y="290" font-size="19">role=button, label</text>
    <text class="sub" x="464" y="314" font-size="19">"Toggle details".</text>
    <!-- export -->
    <rect x="446" y="350" width="268" height="48" rx="10" fill="none" stroke="#2a3140" stroke-width="2"/>
    <text class="chip" x="476" y="380" font-size="20">Export Markdown ↗</text>
  </g>
</svg>
